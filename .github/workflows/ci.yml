name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code quality & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: ^12.21.0
          runtime: node@24

      - name: Typecheck
        run: pnpm typecheck

      - name: Prettier formatting check
        run: pnpm format:check

      - name: Build
        run: pnpm docs:build
